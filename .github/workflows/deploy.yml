name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 65002
          script: |
            cd /home/u156729731/domains/edonate.online/public_html
            if [ ! -d ".git" ]; then
              echo "No git repo found. Initializing clone..."
              git clone https://github.com/merrickfortis24/edonate_web_finals.git .
            else
              echo "Git repo exists. Pulling latest code..."
              git fetch origin main
              git reset --hard origin/main
            fi
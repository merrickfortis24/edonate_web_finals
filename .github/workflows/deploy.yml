name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 65002
          script: |
            cd /home/u156729731/domains/edonate.online/public_html
            REPO_URL="https://github.com/merrickfortis24/edonate_web_finals.git"
            if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              echo "Git repo exists. Pulling latest code..."
            else
              echo "No git repo found. Initializing repository..."
              rm -rf .git
              git init
            fi
            if git remote get-url origin >/dev/null 2>&1; then
              git remote set-url origin "$REPO_URL"
            else
              git remote add origin "$REPO_URL"
            fi
            git fetch origin main
            git reset --hard origin/main
name: Deploy to Hostinger
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 65002
          script: |
            set -e
            cd /home/u156729731/domains/edonate.online/public_html
            REPO_URL="git@github.com:merrickfortis24/edonate_web_finals.git"
            export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new"
            if git rev-parse --is-inside-work-tree >/dev/null 2>&1 && git fsck --no-progress >/dev/null 2>&1; then
              echo "Valid git repo detected."
            else
              echo "Git repo missing, corrupt, or incomplete. Reinitializing repository..."
              rm -rf .git
              git init
            fi
            if git remote get-url origin >/dev/null 2>&1; then
              git remote remove origin
            fi
            git remote add origin "$REPO_URL"
            git fetch --prune origin main
            git reset --hard origin/main

            # The repository keeps the deployable public source in the
            # top-level public_html folder, while Hostinger serves this outer
            # public_html directory. Fail before bootstrapping Laravel if the
            # checked-in front controller source is missing.
            test -f /home/u156729731/domains/edonate.online/public_html/public_html/index.php
            test -f /home/u156729731/domains/edonate.online/public_html/public_html/.htaccess
            cd /home/u156729731/domains/edonate.online/public_html/edonate_web
            php scripts/sync-public-assets.php \
              --web-root=/home/u156729731/domains/edonate.online/public_html

            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan view:cache

            test -f /home/u156729731/domains/edonate.online/public_html/index.php
            test -f /home/u156729731/domains/edonate.online/public_html/.htaccess
            test -f /home/u156729731/domains/edonate.online/public_html/edonate_web/vendor/autoload.php
            grep -Fq "edonate_web/vendor/autoload.php" /home/u156729731/domains/edonate.online/public_html/index.php
            grep -Fq "edonate_web/bootstrap/app.php" /home/u156729731/domains/edonate.online/public_html/index.php
            grep -Fq "RewriteRule ^ index.php" /home/u156729731/domains/edonate.online/public_html/.htaccess
            php artisan route:list --path=admin/login --no-ansi | grep -Fq "admin/login"
